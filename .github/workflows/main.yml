name: Build Fritzing for Windows

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows MSVC Build
    runs-on: windows-latest

    steps:
      # 1. Checkout the main Fritzing application code
      - name: Checkout fritzing-app
        uses: actions/checkout@v4
        with:
          path: fritzing-app

      # 2. Checkout Fritzing parts (Required sibling directory)
      - name: Checkout fritzing-parts
        uses: actions/checkout@v4
        with:
          repository: fritzing/fritzing-parts
          path: fritzing-parts

      # 3. Install Qt with Caching Enabled
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3' 
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          setup-python: 'false'
          cached: 'true'

      # 4. Set up MSVC Developer Command Prompt (Provides 'nmake')
      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      # 5. Install required C++ dependencies using vcpkg
      - name: Install Dependencies via vcpkg
        run: |
          vcpkg install boost-system:x64-windows boost-filesystem:x64-windows libgit2:x64-windows zlib:x64-windows quazip:x64-windows clipper:x64-windows
        shell: pwsh

      # 6. Link dependencies to look like sibling folders so phoenix.pro can find them
      - name: Link Sibling Dependencies
        working-directory: ${{ github.workspace }}
        run: |
          $vcpkg_root = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows"
          # Create symbolic links so Fritzing's rigid internal paths map to vcpkg
          New-Item -ItemType SymbolicLink -Path "libgit2" -Target "$vcpkg_root"
          New-Item -ItemType SymbolicLink -Path "boost" -Target "$vcpkg_root/include"
          New-Item -ItemType SymbolicLink -Path "quazip" -Target "$vcpkg_root"
          New-Item -ItemType SymbolicLink -Path "clipper" -Target "$vcpkg_root"
        shell: pwsh

      # 7. Configure the build using QMake
      - name: Run QMake
        working-directory: ${{ github.workspace }}/fritzing-app
        run: |
          & "${{ env.Qt6_DIR }}/bin/qmake.exe" phoenix.pro -r CONFIG+=release
        shell: pwsh

      # 8. Build the application using NMake
      - name: Build Fritzing via NMake
        working-directory: ${{ github.workspace }}/fritzing-app
        run: nmake

      # 9. Upload the compiled executable as a workflow artifact
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fritzing-Windows-Release
          path: |
            fritzing-app/release/*.exe
            fritzing-app/release/*.dll
          retention-days: 7
