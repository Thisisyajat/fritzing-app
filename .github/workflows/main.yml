name: Build Fritzing for Windows

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch: # Allows manual triggering from the GitHub UI

jobs:
  build-windows:
    name: Windows MSVC Build
    runs-on: windows-latest

    steps:
      # 1. Checkout the main Fritzing application code
      - name: Checkout fritzing-app
        uses: actions/checkout@v4
        with:
          path: fritzing-app

      # 2. Checkout Fritzing parts (required by the app to run/build properly)
      # Fritzing expects the 'fritzing-parts' folder to be at the same directory level as 'fritzing-app'
      - name: Checkout fritzing-parts
        uses: actions/checkout@v4
        with:
          repository: fritzing/fritzing-parts
          path: fritzing-parts

      # 3. Install Qt (Fritzing is transitioning to Qt6, but 5.15 is still widely used. Adjust version if needed)
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3' 
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          setup-python: 'false' # Skips python setup to save time if not needed

      # 4. Install required C++ dependencies using the pre-installed vcpkg
      - name: Install Dependencies (Boost & libgit2)
        run: |
          vcpkg install boost-system:x64-windows boost-filesystem:x64-windows libgit2:x64-windows zlib:x64-windows
          vcpkg integrate install
        shell: pwsh

      # 5. Configure the build using CMake
      - name: Configure CMake
        working-directory: ${{ github.workspace }}/fritzing-app
        run: |
          mkdir build
          cd build
          # Pass vcpkg toolchain for dependencies and locate Qt
          cmake .. `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR"
        shell: pwsh

      # 6. Build the application
      - name: Build Fritzing
        working-directory: ${{ github.workspace }}/fritzing-app/build
        run: cmake --build . --config Release --parallel 4

      # 7. Upload the compiled executable as a workflow artifact
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fritzing-Windows-Release
          path: |
            fritzing-app/build/Release/*.exe
            fritzing-app/build/Release/*.dll
          retention-days: 7
