name: Build Fritzing for Windows

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install aqtinstall

      - name: Install Qt 6.5.9
        shell: pwsh
        run: |
          python -m aqt install-qt windows desktop 6.5.9 win64_msvc2019_64 --outputdir "$env:GITHUB_WORKSPACE\Qt" --modules qtserialport

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Add Qt to PATH
        shell: pwsh
        run: |
          "$env:GITHUB_WORKSPACE\Qt\6.5.9\msvc2019_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Qt installation
        shell: pwsh
        run: |
          qmake --version

      - name: Build
        shell: cmd
        run: |
          if not exist build mkdir build
          cd build
          qmake ..\phoenix.pro CONFIG+=release
          nmake

      - name: Package artifact
        shell: pwsh
        run: |
          if (!(Test-Path build\release64\Fritzing.exe)) { throw 'Fritzing.exe not found in build\release64' }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\release64\Fritzing.exe dist\fritzing.exe
          $assets = @('help','resources','sketches','translations','pri')
          foreach ($asset in $assets) {
            if (Test-Path $asset) {
              Copy-Item $asset (Join-Path dist $asset) -Recurse -Force
            }
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fritzing-windows
          path: dist
          if-no-files-found: error
